# === Hyprland 0.53+ (New Block Syntax) ===
windowrule {
  name = omarchy-ai-usage-float
  match:class = ^(org\.omarchy\.ai-usage)$
  float = on
  center = on
  size = 1120 680
}

# === Hyprland <= 0.52 (Legacy Syntax) ===
# windowrulev2 = float, class:^(org\.omarchy\.ai-usage)$
# windowrulev2 = center, class:^(org\.omarchy\.ai-usage)$
# windowrulev2 = size 1120 680, class:^(org\.omarchy\.ai-usage)$
